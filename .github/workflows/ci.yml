name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ingestion-service/go.mod
          cache-dependency-path: ingestion-service/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: ingestion-service
        working-directory: ingestion-service
        run: go vet ./... && go test -race ./...
      - name: orchestration-api
        working-directory: orchestration-api
        run: npm ci && npm run typecheck && npm test
      - name: fleet-dashboard
        working-directory: fleet-dashboard
        run: npm ci && npm run typecheck && npm run build
      - name: Kubernetes manifests
        run: |
          for overlay in local production; do kubectl kustomize deploy/k8s/overlays/$overlay > /tmp/$overlay.yaml; done
          docker run --rm -v /tmp:/m:ro ghcr.io/yannh/kubeconform:latest -strict -summary /m/local.yaml /m/production.yaml

  # Images the production overlay deploys: ghcr.io/cnotv/robot-fleet-platform/<service>:sha-<commit> and :latest
  images:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: ingestion-service, context: ingestion-service, target: runtime }
          - { name: simulator, context: ingestion-service, target: simulator }
          - { name: orchestration-api, context: orchestration-api, target: runtime, contexts: fleet=ingestion-service/cmd/simulator }
          - { name: fleet-dashboard, context: fleet-dashboard, target: runtime }
    steps:
      - uses: actions/checkout@v7
      # arm64 too, so the images run on ARM servers (Hetzner CAX, AWS Graviton, Ampere).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          build-contexts: ${{ matrix.contexts }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
