name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ingestion-service/go.mod
          cache-dependency-path: ingestion-service/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: ingestion-service
        working-directory: ingestion-service
        run: go vet ./... && go test -race ./...
      - name: orchestration-api
        working-directory: orchestration-api
        run: npm ci && npm run typecheck && npm test
      - name: fleet-dashboard
        working-directory: fleet-dashboard
        run: npm ci && npm run typecheck && npm run build
      - name: Kubernetes manifests
        run: |
          for overlay in local production; do kubectl kustomize deploy/k8s/overlays/$overlay > /tmp/$overlay.yaml; done
          docker run --rm -v /tmp:/m:ro ghcr.io/yannh/kubeconform:latest -strict -summary /m/local.yaml /m/production.yaml

  # Images the VM and Kubernetes setups deploy:
  #   ghcr.io/cnotv/robot-fleet-platform/<service>:sha-<commit> and :latest, for amd64 and arm64.
  # Each architecture builds on a native runner (emulated Node crashes), then `merge`
  # publishes one multi architecture tag per image.
  images:
    if: github.event_name == 'push'
    needs: test
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: ingestion-service, context: ingestion-service, target: runtime }
          - { name: simulator, context: ingestion-service, target: simulator }
          - { name: orchestration-api, context: orchestration-api, target: runtime, contexts: fleet=ingestion-service/cmd/simulator }
          - { name: fleet-dashboard, context: fleet-dashboard, target: runtime }
        arch:
          - { platform: linux/amd64, runner: ubuntu-latest, suffix: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, suffix: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image.name }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          target: ${{ matrix.image.target }}
          build-contexts: ${{ matrix.image.contexts }}
          platforms: ${{ matrix.arch.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.arch.suffix }}
      - run: mkdir -p /tmp/digests && touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.arch.suffix }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        name: [ingestion-service, simulator, orchestration-api, fleet-dashboard]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.name }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.name }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:latest"
