# 1,000 virtual robots from hotel-fleet.json, connected through the ingestion Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: simulator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: simulator }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: simulator
          image: simulator
          imagePullPolicy: IfNotPresent
          args: [-url, ws://ingestion-service:8080, -interval, 1s]
          resources:
            requests: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
