# Needs metrics-server. The orchestration API is not scaled: it must stay at one replica.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestion-service
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ingestion-service }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fleet-dashboard
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: fleet-dashboard }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
# Keep robots connected through node drains and cluster upgrades.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ingestion-service
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ingestion-service }
