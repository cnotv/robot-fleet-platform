apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: fleet-dashboard
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef: { name: fleet-config }
          readinessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-dashboard
spec:
  selector:
    app.kubernetes.io/name: fleet-dashboard
  ports:
    - name: http
      port: 3000
      targetPort: http
